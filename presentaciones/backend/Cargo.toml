[package]
name = "avances-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "macros", "migrate"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Documentos: PDF con la fuente incrustada y PowerPoint armado a mano.
printpdf = { version = "0.7", features = ["font_subsetting"] }
ttf-parser = "0.21"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Para juntar el fondo de cada diseño de la plantilla con sus logos.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Las dependencias optimizadas también en desarrollo: leer la plantilla y
# armar el PDF tarda segundos sin optimizar y milisegundos optimizado.
[profile.dev.package."*"]
opt-level = 2
