services:
  bd:
    image: postgres:16-alpine
    container_name: finanzas-bd
    environment:
      POSTGRES_USER: carlos
      POSTGRES_PASSWORD: carlos
      POSTGRES_DB: finanzas
    ports:
      - "5432:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carlos -d finanzas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datos:
