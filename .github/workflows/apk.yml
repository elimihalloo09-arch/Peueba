name: APK

# Compila el APK de Android de la app movil y lo publica para descargarlo
# desde el telefono, sin necesitar una computadora.

on:
  push:
    paths:
      - 'movil/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Analisis
        run: flutter analyze

      - name: Pruebas
        run: flutter test

      - name: Compilar APK
        run: flutter build apk --release

      - name: Nombrar el APK con el numero de build
        run: mv build/app/outputs/flutter-apk/app-release.apk finanzas-${{ github.run_number }}.apk

      - name: Subir como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: finanzas-apk
          path: movil/finanzas-${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publicar release descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Mis Finanzas - build ${{ github.run_number }}
          body: |
            APK listo para instalar en el telefono.

            Descarga `finanzas-${{ github.run_number }}.apk` de aqui abajo,
            abrelo desde las descargas y acepta instalar de origen desconocido.

            Commit: ${{ github.sha }}
          files: movil/finanzas-${{ github.run_number }}.apk
          make_latest: true
